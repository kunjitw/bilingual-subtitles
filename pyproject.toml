[project]
name = "bilingual-subtitles"
version = "0.1.0"
description = "本機影片轉字幕、翻譯、雙語播放（Windows + NVIDIA 顯示卡）"
license = "GPL-3.0-or-later"
requires-python = "==3.12.*"
# 直接用到的套件（從 app/ 的 import 整理），版本跟作者 conda env subtitle 測過的一樣。
# yt-dlp 不放在這裡：YouTube 常改規則，由 launcher\setup_runtime.py 另外安裝和更新（打包計畫 D8）。
dependencies = [
    # 網頁伺服器
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
    "psutil==7.2.2",
    "numpy==2.5.3",
    "soundfile==0.14.0",
    "huggingface-hub[hf-xet]==0.36.2",
    # 辨識、對齊、VAD（torch 系列一定要從 PyTorch 的 cu130 index 裝）
    "torch==2.14.0",
    "torchaudio==2.11.0",
    "torchvision==0.29.0",
    "transformers==4.57.6",
    "accelerate==1.12.0",
    "qwen-asr==0.0.6",
    "silero-vad==6.2.1",
    "librosa==1.0.0",
    # 繁簡轉換
    "opencc-python-reimplemented==0.1.7",
    # 日文：假名、斷詞（onnxruntime 沒有任何套件宣告依賴它，要自己列）
    "jaconv==0.5.0",
    "pyopenjtalk-plus[tsqyomi]==0.4.1.post9",
    "onnxruntime==1.30.0",
    "fugashi==1.5.2",
    "unidic-lite==1.0.8",
    # 英文查字
    "spacy==3.8.16",
    "en-core-web-sm==3.8.0",
    "wordfreq==3.1.1",
    # 中文斷詞
    "ckip-transformers==0.3.4",
    # 歌曲模式的人聲分離（audio-separator 會 import audioread，但沒有宣告依賴它，要自己列）
    "audio-separator==0.47.0",
    "audioread==3.1.0",
    # 第一次打開時自動建字典：解壓 ECDICT 的 stardict.7z（不依賴 7-Zip，app/dict_build.py）
    "py7zr==1.1.3",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
# 間接相依也鎖成作者 conda env subtitle 裡測過的版本（2026-09-17 匯出）。
# 更新套件時：先在 conda env 測過，再改這裡和上面的版本，然後 uv lock。
